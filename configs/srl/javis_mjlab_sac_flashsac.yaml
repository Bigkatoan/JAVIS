# SAC on the real mjlab task, same (batch_size=8192, gradient_steps=16)
# large-batch/few-update setup as javis_mjlab_sac.yaml, PLUS the changes
# a full investigation found necessary to make that setup actually stable:
#
# `train.min_alpha` below needs https://github.com/Bigkatoan/SRL/pull/40
# merged to actually do anything -- SRL's config loader silently DROPS any
# train:/actor: key that isn't a field on the installed SACConfig, so on an
# install from before that PR merges this key is silently ignored and
# training falls back to the old unfloored-alpha behavior with zero
# warning. Re-run `.venv/bin/pip install -e ".[srl]" --upgrade` (or
# otherwise force-reinstall srl-rl) after that PR lands if you installed
# before it did. See this file's "Update" section further down for the
# full real-GPU before/after numbers this is based on.
#
#   1. `norm: batch_norm` on every actor/critic MLP layer (was `layer_norm`),
#      + `train.weight_norm_projection: true` -- FlashSAC's (arXiv:2604.04539
#      section 4.2) two cheapest stability mechanisms. Needs Bigkatoan/SRL's
#      `feat/flashsac-weight-norm-batchnorm` branch/PR.
#   2. `train.lr_alpha: 3e-5` (10x lower than javis_mjlab_sac.yaml's 3e-4) --
#      REQUIRED, not optional. See "Why lr_alpha, not just #1" below.
#   3. Depends on Bigkatoan/SRL's `fix/sac-actor-only-encoder-never-trains`
#      (PR #33) being installed too -- a separate, pre-existing bug where
#      `actor_state_enc` (this config's dedicated actor encoder) never
#      received a gradient any optimizer consumed, silently frozen at
#      random init for the whole run. Not required for stability here (the
#      run below is stable with or without it -- see the investigation
#      notes), but it's a real correctness bug this config would otherwise
#      be masking, and BatchNorm's condition below assumes it's applied.
#
# ============================================================================
# Why this combination, and not just #1: a full investigation
# ============================================================================
#
# javis_mjlab_sac.yaml's (8192, 16) config, verified over a real 2M-step run,
# reaches PPO's eventual quality ~3.4x faster and briefly overshoots to 4-5x
# higher score, but then DECLINES over the rest of the run, ending worse than
# where it started -- correlated with auto-entropy alpha collapsing from 0.20
# to ~0.0002 well before the run ends.
#
# Tested in isolation, on the SAME (8192, 16) config, each against a real
# 2M-step run (n_envs=512, eval-episodes=30):
#
#   lr_alpha=3e-4 (unmodified), layer_norm (baseline):
#       wildly oscillates 1-9 the whole run, never stabilizes, ends 1.30.
#   lr_alpha=3e-5 alone (unmodified architecture):
#       peaks ~2.0 at step 500k, then a real ~900k-step decline to ~1.2,
#       partial late recovery to 1.63 at 2M -- alpha collapse is fixed
#       (ends at 0.031, not 0.0002), but instability persists.
#   batch_norm + weight_norm_projection alone (lr_alpha unchanged):
#       WORSE than doing nothing -- peaks ~2.0 then crashes through
#       negative territory (-0.42 at step 1.4M), ends 0.31.
#   batch_norm + weight_norm_projection + the encoder fix, lr_alpha
#   UNCHANGED: still bad, and in a NEW way -- 3 of 20 eval points showed
#       genuine numerical explosions (episode returns as extreme as
#       -1.5e20), traced to `javis/mdp/rewards.py`'s `pitch_rate_l2` (an
#       unclamped squared angular velocity) combined with a physics
#       integrator divergence -- a pre-existing JAVIS reward-shaping gap
#       that a merely-capable actor (this repo's encoder fix gives the
#       actor real trained features, not frozen random ones) can apparently
#       find and trigger once entropy regularization has fully collapsed
#       (alpha near 0 removes the one force discouraging over-exploiting a
#       possibly-wrong critic into a fragile, physically extreme action).
#   ALL of the above together (this config): stable across two independent
#       runs (both with and without the encoder fix layered in) -- no
#       decline, no crash, no numerical explosions, plateaus around
#       1.0-1.5, ends at 1.17 in both runs (rolling-mean convergence by
#       step ~400k / ~160s wall-clock).
#
# So lr_alpha is not a nice-to-have on top of the architectural fix -- it is
# what keeps the architectural fix from being actively harmful. Once alpha
# stops fully collapsing, the actor never loses its entropy regularization,
# which appears to be what prevents both the slow decline AND the
# reward-function-triggering numerical explosions above.
#
# ============================================================================
# The honest limitation: this plateau is BELOW PPO's, not above it
# ============================================================================
#
# PPO (javis_mjlab_ppo.yaml) converges (same rolling-mean criterion) to
# roughly 2.05 by wall-clock ~475s. This config's plateau (~1.0-1.5, final
# ~1.17) is reached ~3x faster in wall-clock (~160s) but is meaningfully
# LOWER than PPO's -- roughly 60% of it. This config is a genuine fix for
# the instability (fast AND stable, where the unmodified (8192, 16) config
# was fast but unstable), not a fix that also matches or beats PPO's
# eventual quality. FlashSAC's paper's full recipe (residual blocks,
# RMSNorm, a distributional critic with adaptive reward scaling, noise
# repetition, a unified entropy target) is considerably larger than the two
# cheapest mechanisms implemented here; closing the remaining gap to PPO's
# plateau likely needs more of that stack, not just lr_alpha tuning on top
# of what's here.
#
# ============================================================================
# Update: the 2M-step "stable" verdict above did not hold at 10M steps
# ============================================================================
#
# This config was verified stable over 2M steps (above). Given PPO needed a
# much longer budget to reveal its own peak-then-decline problem (see
# javis_mjlab_ppo.yaml / README.md), the same question was asked of this
# config: does the 2M-step plateau actually hold 5x longer, or was it just
# too short a test?
#
# Real 10M-step run, this exact config, no changes: held a noisy-but-bounded
# score (~0.5-1.9) through step 6M, then `sac/alpha` -- despite lr_alpha
# already being 10x lower specifically to prevent this -- collapsed from a
# healthy magnitude down to ~3e-4 (same order of magnitude as the *unfixed*
# baseline's 0.0002 collapse above) between steps 6M-7M, immediately
# followed by a numerical-explosion episode return of -7,148,403 -- the
# exact `pitch_rate_l2` exploit already diagnosed above, just delayed
# rather than prevented. It recurred a second time at step 9M (-2,518.5).
# Final score at step 10M: -40.57, never recovered. lr_alpha=3e-5 bought
# time, not a permanent fix.
#
# `train.min_alpha: 1e-3` below (Bigkatoan/SRL#40) is a real floor on
# `log_alpha` (otherwise an unclamped free parameter) added specifically in
# response to this. Same 10M-step run with only `min_alpha` added: **zero
# numerical explosions** (real peak 1.78 at step 3.0M, minimum eval score
# 0.30 the entire run) -- the floor does prevent alpha from ever fully
# collapsing, which does prevent the reward-exploit crashes. But it does
# NOT prevent decline: score still fell from that 1.78 peak to a noisy low
# plateau (~0.3-0.9, final 0.41) for the second half of the run -- worse
# than the un-stress-tested 2M-step "1.17" figure above, and well below
# PPO's own eventual held plateau (~1.1-1.2, verified over a comparable
# 40M-step run -- see README.md). `min_alpha` is a real reliability fix
# (no more silent, data-corrupting crashes) but does not make SAC
# competitive with PPO on this task as currently configured.
#
# ============================================================================
# Update: the actual root cause of the explosions, found and fixed upstream
# ============================================================================
#
# `min_alpha` above treats the SYMPTOM (alpha fully collapsing removes the
# one force discouraging over-exploiting a possibly-wrong critic). Tracing
# the mechanism directly (reading SRL's own training loop, not guessing)
# found the actual bug: SRL's mjlab/isaaclab backend never disabled
# mjlab's own `auto_reset=True` default, so at every time-limit truncation
# the Q-target was bootstrapped off a completely unrelated, freshly-reset
# episode's observation instead of the true terminal state of the episode
# that just ended -- an increasingly large fraction of transitions as the
# policy got good enough to survive to the 20s/2000-step cap, exactly
# matching when these runs were observed to start going wrong. Fixed at
# https://github.com/Bigkatoan/SRL/pull/new/fix/mjlab-auto-reset-and-ppo-gae-off-by-one
# (needs merging; re-run `.venv/bin/pip install -e ".[srl]" --upgrade`
# after it does, same silent-drop-on-old-install caveat as elsewhere in
# this file).
#
# Real-GPU verification, the SHARPEST possible test: this exact config
# with the auto_reset fix applied and `min_alpha` forced OFF (1e-8,
# effectively disabled -- i.e. the exact historically-explosive setup
# above, unmodified otherwise), run the full 10M steps again. Result:
# **zero NaN/Inf/error output anywhere in the run**, both historical
# explosion checkpoints (steps 6-7M and 9M) passed completely clean (worst
# single point: a mild -0.18, immediately recovering to positive), ending
# at 0.42 -- a normal "declines to a modest plateau" shape, not a
# numerical explosion. Confirms the auto_reset bug, not entropy collapse
# per se, was the actual mechanism: correct bootstrapping alone prevents
# the catastrophic failure even with zero entropy floor. `min_alpha`
# remains a reasonable defensive default (belt-and-suspenders against any
# other unbounded-parameter surprise), but is no longer the thing standing
# between this config and a numerical explosion.
#
#   .venv/bin/python scripts/train_srl.py --config configs/srl/javis_mjlab_sac_flashsac.yaml \
#       --env Javis-Payload-Rough --device cuda --n-envs 512

env_id: "Javis-Payload-Rough"
env_type: "mjlab"

algo: sac

encoders:
  - name: actor_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: batch_norm}
      - {out_features: 256, activation: relu, norm: batch_norm}
  - name: critic_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: batch_norm}
      - {out_features: 256, activation: relu, norm: batch_norm}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: squashed_gaussian
  action_dim: 2
  log_std_min: -5.0
  log_std_max: 2.0
  layers:
    - {out_features: 128, activation: relu, norm: batch_norm}

critic:
  name: critic
  type: twin_q
  action_dim: 2
  layers:
    - {out_features: 128, activation: relu, norm: batch_norm}

losses:
  - {name: sac_q,           weight: 1.0}
  - {name: sac_policy,      weight: 1.0}
  - {name: sac_temperature, weight: 1.0}

train:
  total_steps: 2_000_000
  n_envs: 512
  lr_actor: 3e-4
  lr_critic: 3e-4
  # 10x lower than javis_mjlab_sac.yaml's 3e-4 -- REQUIRED for stability
  # with this combination, not just a speed/quality tweak. See this file's
  # header comment: without this, batch_norm + weight_norm_projection on
  # top of (8192, 16) is worse than doing nothing at all (crashes into
  # negative-score territory, or -- with the actor-encoder fix also
  # applied -- intermittently produces astronomical-magnitude episode
  # returns from a pre-existing unclamped reward term). With it, both
  # tested variants (with and without the encoder fix) ran the full 2M
  # steps cleanly and stably.
  lr_alpha: 3e-5
  buffer_size: 1_000_000
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  auto_entropy_tuning: true
  start_steps: 10_000
  update_after: 5_000
  update_every: 512
  replay_n_step: 1
  use_fp16: false
  use_async: true
  use_gpu_buffer: true
  # Unchanged from javis_mjlab_sac.yaml -- see that file's comment for the
  # full rationale/benchmarking behind this pair of numbers.
  batch_size: 8192
  gradient_steps: 16
  # FlashSAC weight normalization (arXiv:2604.04539 section 4.2) -- see
  # this file's header comment.
  weight_norm_projection: true
  # Floor on the auto-tuned temperature (Bigkatoan/SRL#40) -- REQUIRED for
  # a long run, not optional, same as lr_alpha above: verified on a real
  # 10M-step run that alpha still eventually collapses despite lr_alpha
  # already being 10x lower, triggering the exact pitch_rate_l2-exploit
  # numerical explosions this config's header comment describes. With this
  # floor, zero explosions across the full 10M steps -- see the "Update"
  # section in this file's header comment for the full real-GPU numbers
  # (this does NOT fix the separate, still-open decline-to-a-low-plateau
  # problem, only the crashes).
  min_alpha: 1e-3
  # Best-checkpoint tracking (SRL#38) -- this config still declines from
  # its peak over a long run (see header comment), so the actual best
  # policy needs to be tracked independently of the final checkpoint, same
  # reasoning as javis_mjlab_ppo.yaml.
  save_best: true
