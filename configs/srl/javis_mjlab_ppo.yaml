# PPO on the REAL mjlab task (javis/balance_task.py's Javis-Payload-Rough),
# through SRL's new mjlab backend (srl/cli/train.py's "mjlab" env_type) --
# GPU-batched in one process, no real Isaac Sim/isaaclab install needed.
# obs=384 ("actor" group), act=2 (wheel velocity targets).
#
#   .venv/bin/python scripts/train_srl.py --config configs/srl/javis_mjlab_ppo.yaml \
#       --env Javis-Payload-Rough --device cuda --n-envs 4096
#
# --n-envs here is mjlab-sized (hundreds to thousands, GPU-batched inside
# one process), not the SubprocVecEnv-sized tens javis_balance_ppo.yaml (the
# plain-MuJoCo config) uses -- see javis/gym_env_mjlab.py's docstring for why
# that distinction matters. env_type: mjlab is what makes srl-train skip its
# own SyncVectorEnv/AsyncVectorEnv wrapping and build one already-batched env
# instead (same reasoning SRL already applies to real Isaac Lab envs).
#
# lr_schedule/desired_kl/max_lr/state_dependent_std/log_std_init below need
# https://github.com/Bigkatoan/SRL/pull/39 merged (adaptive KL-based LR
# schedule) to actually do anything -- SRL's config loader silently DROPS
# any train:/actor: key that isn't a field on the installed PPOConfig/
# HeadConfig, so on an SRL install from before that PR merges, this config
# will run with old-style fixed-lr/state-dependent-std behavior with ZERO
# warning that anything was ignored. Re-run `.venv/bin/pip install -e
# ".[srl]" --upgrade` (or otherwise force-reinstall srl-rl) after that PR
# lands if you installed before it did. See README.md's "Which one to
# actually use" section and SRL PR #39's description for the full,
# real-GPU-verified before/after numbers this is based on -- short version:
# these settings substantially raise and delay the peak eval/score_mean a
# run reaches (1.87->3.18 in testing) but do NOT yet make it hold flat
# indefinitely; `save_best: true` below exists specifically because of that
# -- always check the saved best_*.pt against final_*.pt before deploying.
#
# entropy_coef_final/entropy_coef_anneal_steps below need
# https://github.com/Bigkatoan/SRL/pull/new/fix/mjlab-auto-reset-and-ppo-gae-off-by-one
# merged (same silent-drop caveat as above -- re-upgrade after it lands).
# That same branch also fixes two bugs upstream of this task's actual
# instability, found investigating why the adaptive-KL-LR fix above still
# didn't make PPO hold flat: (1) mjlab's own `auto_reset=True` default was
# silently handing PPO's GAE bootstrap the WRONG next-state (a different,
# freshly-reset episode's first frame) at every time-limit truncation; (2)
# RolloutBuffer.compute_returns_and_advantages had a genuine off-by-one in
# which `done` flag gated the GAE chain-break, unrelated to mjlab, present
# on every PPO run in this library. Real-GPU-verified real 40M-step runs,
# both with `lr_schedule="adaptive"` already on:
#   fix #1+#2 alone: peaks far higher than the original bug (10.05 @ step
#     11M vs. 3.18 @ step 10M) and holds it much longer, but still
#     declines afterward -- traced to ppo/entropy climbing continuously
#     and monotonically for the ENTIRE run (the opposite of the earlier
#     entropy-COLLAPSE story, but the same "nothing bounds a monotonic
#     drift" shape of problem), ending BELOW the original bug's own
#     eventual plateau (0.77 vs. 1.10-1.23 @ step 40M).
#   + entropy_coef_final/entropy_coef_anneal_steps (this config, below):
#     a much longer-sustained elevated plateau (average ~4.2 across steps
#     6M-28M) that then settles into a genuinely STABLE second plateau for
#     the last 12M steps (1.45-1.85, not still declining at step 40M) --
#     ends at 1.45, ~2x the fix-#1+#2-alone run's final value and above
#     the original bug's own plateau.
# Still not a clean "peaks and holds at its peak" outcome -- the run does
# settle down from its mid-run plateau to a lower one -- but a real,
# verified, substantial improvement over both the original bug and the
# auto_reset/GAE fix alone. `save_best: true` remains necessary regardless.

env_id: "Javis-Payload-Rough"
env_type: "mjlab"

algo: ppo

encoders:
  # Two separate encoders (not a shared one, unlike javis_balance_ppo.yaml)
  # since input_name is what selects mjlab's "actor" observation group out
  # of the two it publishes ("actor", "critic" -- the privileged group SRL
  # has no asymmetric actor-critic slot for, so it's simply not read here).
  - name: actor_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: elu, norm: none}
      - {out_features: 256, activation: elu, norm: none}
  - name: critic_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: elu, norm: none}
      - {out_features: 256, activation: elu, norm: none}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: gaussian
  action_dim: 2
  # Matches mjlab's own rsl_rl reference config for this exact task
  # (javis_balance_ppo_runner_cfg in javis/balance_task.py: std_type=
  # "scalar", init_std=1.0) instead of the arbitrary log_std_init=-1.0
  # (std=0.368) + default state_dependent_std=True this used to have --
  # untested whether this alone matters much, but it's free to match a
  # working reference exactly rather than guess.
  log_std_init: 0.0
  state_dependent_std: false
  layers:
    - {out_features: 128, activation: elu, norm: none}

critic:
  name: critic
  type: value
  layers:
    - {out_features: 128, activation: elu, norm: none}

losses:
  - {name: policy,  weight: 1.0}
  - {name: value,   weight: 1.0}
  - {name: entropy, weight: 0.005}

train:
  # 40M, not 20M -- this is the step budget the real verification runs
  # referenced throughout this file's comments and README.md actually
  # used. The decline (and the entropy-annealing fix's effect) mostly
  # plays out in the back half of that budget; a 20M-step run would stop
  # before the interesting part.
  total_steps: 40_000_000
  n_envs: 4096
  n_steps: 24
  batch_size: 16384
  n_epochs: 5
  lr: 1e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 1.0
  # Adaptive KL-based LR schedule (SRL PR #39) -- ports mjlab's own rsl_rl
  # reference training path's schedule="adaptive"/desired_kl=0.01 for this
  # exact task. max_lr is deliberately capped at this config's own tuned
  # `lr` (1e-3), NOT rsl_rl's raw 1e-2 constant -- verified on this task
  # that blindly using 1e-2 (10x this lr) is actively worse than no
  # adaptive schedule at all (LR spent nearly the whole run pinned near
  # that ceiling). See SRL PR #39 for the full real-GPU comparison.
  lr_schedule: adaptive
  desired_kl: 0.01
  max_lr: 1e-3
  # Entropy-coefficient annealing -- see this file's header comment for
  # the full real-GPU before/after. Units are GRADIENT steps (one per
  # minibatch -- the same counter lr_schedule="adaptive" above already
  # uses internally), not env steps: n_epochs * (n_steps*n_envs/
  # batch_size) = 5 * (24*4096/16384) = 30 gradient steps per iteration,
  # total_steps/(_n_steps*n_envs) ~= 407 iterations for this config's
  # 40M-step budget -> ~12,180 total gradient steps. 8000 (~65% of that)
  # anneals entropy_coef from 0.005 down to 10% of that (0.0005), then
  # holds the floor for the remaining ~35% of the run -- real exploration
  # pressure early, much weaker constant upward pull on policy std late.
  # Recompute proportionally if total_steps/n_epochs/batch_size change.
  entropy_coef_final: 0.0005
  entropy_coef_anneal_steps: 8000
  # Best-checkpoint tracking (SRL PR #38, merged) -- necessary as long as
  # this run peaks-then-declines rather than holding flat: saves
  # best_*.pt (highest eval/score_mean seen) alongside the periodic/final
  # checkpoints, so the actual best policy from a run is always
  # recoverable regardless of where training ends up by the final step.
  save_best: true
  eval_freq: 1000000
  eval_episodes: 30
