# PPO on the REAL mjlab task (javis/balance_task.py's Javis-Payload-Rough),
# through SRL's new mjlab backend (srl/cli/train.py's "mjlab" env_type) --
# GPU-batched in one process, no real Isaac Sim/isaaclab install needed.
# obs=384 ("actor" group), act=2 (wheel velocity targets).
#
#   .venv/bin/python scripts/train_srl.py --config configs/srl/javis_mjlab_ppo.yaml \
#       --env Javis-Payload-Rough --device cuda --n-envs 4096
#
# --n-envs here is mjlab-sized (hundreds to thousands, GPU-batched inside
# one process), not the SubprocVecEnv-sized tens javis_balance_ppo.yaml (the
# plain-MuJoCo config) uses -- see javis/gym_env_mjlab.py's docstring for why
# that distinction matters. env_type: mjlab is what makes srl-train skip its
# own SyncVectorEnv/AsyncVectorEnv wrapping and build one already-batched env
# instead (same reasoning SRL already applies to real Isaac Lab envs).
#
# lr_schedule/desired_kl/max_lr/state_dependent_std/log_std_init below need
# https://github.com/Bigkatoan/SRL/pull/39 merged (adaptive KL-based LR
# schedule) to actually do anything -- SRL's config loader silently DROPS
# any train:/actor: key that isn't a field on the installed PPOConfig/
# HeadConfig, so on an SRL install from before that PR merges, this config
# will run with old-style fixed-lr/state-dependent-std behavior with ZERO
# warning that anything was ignored. Re-run `.venv/bin/pip install -e
# ".[srl]" --upgrade` (or otherwise force-reinstall srl-rl) after that PR
# lands if you installed before it did. See README.md's "Which one to
# actually use" section and SRL PR #39's description for the full,
# real-GPU-verified before/after numbers this is based on -- short version:
# these settings substantially raise and delay the peak eval/score_mean a
# run reaches (1.87->3.18 in testing) but do NOT yet make it hold flat
# indefinitely; `save_best: true` below exists specifically because of that
# -- always check the saved best_*.pt against final_*.pt before deploying.
#
# train.target_entropy/actor.log_std_min below need
# https://github.com/Bigkatoan/SRL/pull/new/feat/ppo-adaptive-target-entropy
# merged (same silent-drop caveat as above -- re-upgrade after it lands; it
# also carries https://github.com/Bigkatoan/SRL/pull/new/fix/mjlab-auto-reset-and-ppo-gae-off-by-one
# and https://github.com/Bigkatoan/SRL/pull/new/fix/checkpoint-callback-interval-modulo,
# both prerequisites for the real numbers below to reproduce).
#
# CORRECTION -- everything in this section used to describe `ppo/entropy`
# "climbing continuously," framed as the opposite of an earlier entropy-
# COLLAPSE hypothesis. That was a sign-reading bug, not a real finding:
# `ppo/entropy` in every log/metrics.jsonl is `entropy_loss(ent) =
# -ent.mean()` (SRL's srl/losses/rl_losses.py), logged via a straight,
# unmodified passthrough -- the NEGATIVE of the true mean entropy, not the
# entropy itself. Confirmed against this task's own actor (log_std_init=
# 0.0, action_dim=2, theoretical initial entropy ~2.838): every real run's
# first logged `ppo/entropy` value is ~-2.76, matching -2.838, not +2.838.
# So the real phenomenon this whole file's history describes was entropy
# COLLAPSE the entire time (true entropy declining from ~+2.8 toward the
# log_std_min floor), never an explosion -- the "opposite of collapse"
# framing was backwards. Real-GPU-verified 40-60M-step runs, all with
# `lr_schedule="adaptive"` already on:
#   auto_reset+GAE fix alone (SRL PR #40): peaks far higher than the
#     original bug (10.05 @ step 11M vs. 3.18 @ step 10M) and holds it
#     much longer, but still declines afterward, ending BELOW the
#     original bug's own eventual plateau (0.77 vs. 1.10-1.23 @ step 40M).
#   entropy_coef_final floor tuning (three real 60M-step runs: 0.0005,
#     0.0, 0.0001): all eventually lost to collapse regardless of floor
#     value, just at different rates -- a fixed/annealed entropy_coef is
#     fundamentally one-directional (pushes entropy up, never pulls an
#     overshoot back down), so no floor value self-corrects. 0.0 (true
#     zero, removing the bonus entirely) was WORST, ending at 0.54 @ 60M,
#     below every other config tried including the original bug's own
#     plateau -- direct evidence the entropy bonus was doing real,
#     load-bearing anti-collapse work, not just adding harmless noise.
#     0.0001 (small nonzero) did better (0.72 @ 60M) but still collapsed.
#   train.target_entropy (this config, below): PPO's entropy_coef becomes
#     a learned, self-correcting parameter (SAC-alpha-style dual ascent)
#     instead of a fixed/annealed dial -- see PPOConfig.target_entropy's
#     docstring in SRL for the derivation. First real 60M-step run: peak
#     27.79 @ step 16M (highest of ANY config tried on this task, beating
#     even the 120M budget's 18.51), a genuinely strong plateau (13-21
#     range) through steps 18-46M -- much longer-held than any fixed-
#     coefficient attempt -- before declining to 4.19 @ 60M. That ending
#     value is still well above every entropy_coef_final floor tried.
#     `ppo/true_entropy` (the CORRECTLY-signed metric this PR adds --
#     `ppo/entropy` remains present too, still negated, for continuity)
#     confirmed NOT running away in the late-stage decline (44-60M):
#     oscillated tightly around target_entropy=0.0 (-0.21 to +0.15) the
#     whole time -- the mechanism held its target successfully, unlike
#     every fixed-coefficient attempt. But `ppo/entropy_weight` (the
#     learned coefficient) repeatedly hit its configured max_entropy_coef
#     ceiling (was 0.02) doing so, suggesting something else pushes
#     entropy down hard in that region and the mechanism was fighting
#     near its limit -- not yet understood, and NOT the same failure mode
#     as the fixed-coefficient runs' unbounded collapse. max_entropy_coef
#     raised to 0.05 (below) for a second run testing whether more
#     headroom changes the late-stage behavior -- update this comment
#     with that result before trusting either value blindly.
#   Deterministic tracking accuracy (scripts/eval_velocity_tracking.py,
#     NOT the same metric as eval/score_mean above) stayed essentially
#     FLAT across every one of these configs and every checkpoint tested
#     (lin_vel error ~0.3-0.4 m/s, ang_vel error ~0.6-0.85 rad/s,
#     including the target_entropy run's own 16M-peak and 60M-final
#     checkpoints) -- the entropy-collapse fix changes SURVIVAL/BALANCE
#     duration (episode_length_mean), not measured command-tracking
#     precision, which appears to be a separate, still-unaddressed
#     ceiling for this task/reward-shaping/architecture combination.
# `save_best: true` remains necessary regardless -- none of these runs
# hold flat at their peak indefinitely yet.

env_id: "Javis-Payload-Rough"
env_type: "mjlab"

algo: ppo

encoders:
  # Two separate encoders (not a shared one, unlike javis_balance_ppo.yaml)
  # since input_name is what selects mjlab's "actor" observation group out
  # of the two it publishes ("actor", "critic" -- the privileged group SRL
  # has no asymmetric actor-critic slot for, so it's simply not read here).
  - name: actor_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: elu, norm: none}
      - {out_features: 256, activation: elu, norm: none}
  - name: critic_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: elu, norm: none}
      - {out_features: 256, activation: elu, norm: none}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: gaussian
  action_dim: 2
  # Matches mjlab's own rsl_rl reference config for this exact task
  # (javis_balance_ppo_runner_cfg in javis/balance_task.py: std_type=
  # "scalar", init_std=1.0) instead of the arbitrary log_std_init=-1.0
  # (std=0.368) + default state_dependent_std=True this used to have --
  # untested whether this alone matters much, but it's free to match a
  # working reference exactly rather than guess.
  log_std_init: 0.0
  state_dependent_std: false
  # log_std_max=1.0 (default is 2.0, std=e^2~=7.4, absurd against a
  # [-1, 1] action range) is a direct, mechanism-independent bound on
  # worst-case action noise -- kept as a safety net even though, per this
  # file's header comment's CORRECTION, real true entropy on this task
  # has never actually been observed approaching this UPPER bound (that
  # was a sign-reading error; the real, repeatedly-observed direction is
  # entropy COLLAPSING toward the LOWER bound instead).
  log_std_max: 1.0
  # The bound that actually matters given the corrected picture above --
  # default is -5.0 (std=e^-5~=0.0067, essentially deterministic).
  # Tightened to -2.0 (std=e^-2~=0.135, still very narrow but not
  # numerically degenerate) as a direct floor on worst-case collapse,
  # independent of whether train.target_entropy below is successfully
  # holding it away from there day to day.
  log_std_min: -2.0
  layers:
    - {out_features: 128, activation: elu, norm: none}

critic:
  name: critic
  type: value
  layers:
    - {out_features: 128, activation: elu, norm: none}

losses:
  - {name: policy,  weight: 1.0}
  - {name: value,   weight: 1.0}
  - {name: entropy, weight: 0.005}

train:
  # 40M, not 20M -- this is the step budget the real verification runs
  # referenced throughout this file's comments and README.md actually
  # used. The decline (and the entropy-annealing fix's effect) mostly
  # plays out in the back half of that budget; a 20M-step run would stop
  # before the interesting part.
  total_steps: 40_000_000
  n_envs: 4096
  n_steps: 24
  batch_size: 16384
  n_epochs: 5
  lr: 1e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 1.0
  # Adaptive KL-based LR schedule (SRL PR #39) -- ports mjlab's own rsl_rl
  # reference training path's schedule="adaptive"/desired_kl=0.01 for this
  # exact task. max_lr is deliberately capped at this config's own tuned
  # `lr` (1e-3), NOT rsl_rl's raw 1e-2 constant -- verified on this task
  # that blindly using 1e-2 (10x this lr) is actively worse than no
  # adaptive schedule at all (LR spent nearly the whole run pinned near
  # that ceiling). See SRL PR #39 for the full real-GPU comparison.
  lr_schedule: adaptive
  desired_kl: 0.01
  max_lr: 1e-3
  # target_entropy supersedes entropy_coef_final/entropy_coef_anneal_steps
  # entirely (mutually exclusive -- see PPOConfig.target_entropy's
  # docstring in SRL). See this file's header comment for the full
  # real-GPU history motivating this over a fixed/annealed floor.
  # target_entropy=0.0 is this task's own data speaking: score stayed
  # healthy while true entropy declined from its ~2.8 init through
  # roughly 0, and degraded once it fell below there -- corresponds to
  # std~=0.24/action-dim for this 2-action-dim Gaussian. Not yet verified
  # as optimal on a real long run (first run used it as a starting guess
  # and got the best PPO result on this task so far -- see header
  # comment -- but a second run tuning max_entropy_coef is in progress).
  target_entropy: 0.0
  entropy_coef_lr: 0.001
  min_entropy_coef: 0.0001
  # 0.05 -- was 0.02 in the first real run, raised after that run showed
  # the learned coefficient repeatedly hitting the 0.02 ceiling during
  # the late-stage (44-60M) decline. See header comment.
  max_entropy_coef: 0.05
  # Best-checkpoint tracking (SRL PR #38, merged) -- necessary as long as
  # this run peaks-then-declines rather than holding flat: saves
  # best_*.pt (highest eval/score_mean seen) alongside the periodic/final
  # checkpoints, so the actual best policy from a run is always
  # recoverable regardless of where training ends up by the final step.
  save_best: true
  eval_freq: 1000000
  eval_episodes: 30
