# SAC on the real mjlab task, through SRL's mjlab backend. See
# javis_mjlab_ppo.yaml's header for how --n-envs/env_type differ from the
# plain-MuJoCo configs.
#
#   .venv/bin/python scripts/train_srl.py --config configs/srl/javis_mjlab_sac.yaml \
#       --env Javis-Payload-Rough --device cuda --n-envs 512
#
# `train.use_async`/`use_gpu_buffer` below (SRL's AsyncOffPolicyRunner) need
# Bigkatoan/SRL#31 (merged) -- reinstall srl-rl (`uv pip install --python
# .venv/bin/python -e ".[srl]" --reinstall-package srl-rl`) if your venv
# predates that merge.

env_id: "Javis-Payload-Rough"
env_type: "mjlab"

algo: sac

encoders:
  - name: actor_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: layer_norm}
      - {out_features: 256, activation: relu, norm: layer_norm}
  - name: critic_state_enc
    type: mlp
    input_name: actor
    input_dim: 384
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: layer_norm}
      - {out_features: 256, activation: relu, norm: layer_norm}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: squashed_gaussian
  action_dim: 2
  log_std_min: -5.0
  log_std_max: 2.0
  layers:
    - {out_features: 128, activation: relu, norm: layer_norm}

critic:
  name: critic
  type: twin_q
  action_dim: 2
  layers:
    - {out_features: 128, activation: relu, norm: layer_norm}

losses:
  - {name: sac_q,           weight: 1.0}
  - {name: sac_policy,      weight: 1.0}
  - {name: sac_temperature, weight: 1.0}

train:
  total_steps: 2_000_000
  n_envs: 512
  lr_actor: 3e-4
  lr_critic: 3e-4
  lr_alpha: 3e-4
  buffer_size: 1_000_000
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  auto_entropy_tuning: true
  start_steps: 10_000
  update_after: 5_000
  update_every: 512
  replay_n_step: 1
  use_fp16: false
  # Overlap gradient updates (background thread, separate CUDA stream) with
  # env stepping instead of blocking on every `update_every`-step batch, and
  # keep the replay buffer resident on-device to skip the default buffer's
  # per-env CPU round-trip. Verified on this exact task/GPU (RTX 3090,
  # Javis-Payload-Rough): same total training work (SAC's per-update
  # counter matches the old sync path exactly at both n_envs=16 and
  # n_envs=512 -- this is not a "trains less, looks faster" shortcut), ~1.5x
  # wall-clock at n_envs=512 versus sync with both flags off. See
  # Bigkatoan/SRL#31 for the bugs that had to be fixed in SRL itself before
  # this combination actually worked end to end.
  use_async: true
  use_gpu_buffer: true
  # batch_size/gradient_steps: restructured from the SAC-textbook default
  # (256, 512) to (8192, 16) -- same total samples processed per
  # update_every cycle (256*512 == 8192*16 == 131_072), just as far fewer,
  # much bigger update() calls instead of many tiny ones. Verified on this
  # exact task/GPU: the 512 tiny (batch=256) update() calls per cycle were
  # each paying a large FIXED per-call cost (Python dispatch, kernel-launch
  # overhead, 3 separate optimizer.step() calls for actor/critic/alpha)
  # that swamped the actual FLOPs at that batch size -- consolidating into
  # 16 big calls amortizes that fixed cost across ~32x more work per call.
  # Real GPU comparison (50_000 steps, n_envs=512, both with
  # use_async+use_gpu_buffer on): (256, 512) = 204.4s, (2048, 64) = 39.9s,
  # (8192, 16) = 23.9s, (32768, 4) = 21.6s -- diminishing returns past
  # ~8192 as env collection (~4000 fps) starts becoming the bottleneck
  # instead of gradient compute, so (8192, 16) is picked as the practical
  # sweet spot rather than the most extreme point tested. NOT verified:
  # whether this batch/gradient_steps restructuring changes total-env-steps
  # needed to actually converge (bigger, less-frequent gradient steps could
  # plausibly need more or fewer total updates than the old (256, 512) --
  # only wall-clock-per-fixed-amount-of-compute was measured here, not
  # sample efficiency) -- worth watching on a real long run.
  batch_size: 8192
  gradient_steps: 16
